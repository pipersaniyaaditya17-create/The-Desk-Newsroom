<!doctype html>
<html lang="en" data-allowed-roles="Journalist,Editor,Admin">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff"><meta name="description" content="The Desk newsroom overview.">
    <title>Dashboard — The Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/data.js"></script><script src="js/auth.js"></script><script src="js/guard.js"></script>
    <script src="js/ui.js" defer></script><script src="js/layout.js" defer></script><script src="js/dashboard.js" defer></script>
  </head>
  <body data-page="dashboard">
    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">EVERY STORY HAS A PLACE. EVERY DETAIL HAS A PERSON.</p>
        <h1 id="page-title">The Desk<span>.</span></h1>
        <p class="hero-copy">A clear line from first thought to the front page.</p>
        <a class="hero-link" href="board.html">Explore the newsroom <span aria-hidden="true">↗</span></a>
      </section>
      <section class="page-section dashboard-section" aria-label="Newsroom overview">
        <div class="stats-row" aria-label="Newsroom statistics">
          <div class="stat"><span class="stat-number" id="stat-total">0</span><span class="stat-label">Total stories</span></div>
          <div class="stat"><span class="stat-number" id="stat-progress">0</span><span class="stat-label">In progress</span></div>
          <div class="stat"><span class="stat-number" id="stat-approval">0</span><span class="stat-label">Awaiting approval</span></div>
          <div class="stat"><span class="stat-number" id="stat-published">0</span><span class="stat-label">Published</span></div>
        </div>
        <div class="section-heading">
          <div><p class="eyebrow">THE NEWSROOM</p><h2>Recent stories</h2></div>
          <a class="text-link" href="board.html">View the board ↗</a>
        </div>
        <div class="recent-grid" id="recent-stories"></div>
      </section>
    </main>
  </body>
</html>
